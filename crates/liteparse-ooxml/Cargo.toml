[package]
name = "liteparse-ooxml"
version = "0.1.0"
edition.workspace = true
license = "MIT"
repository.workspace = true
description = "Native OOXML structure reader (vendored Skia-free subset of dxpdf)"
publish = true

[dependencies]
bitflags = "2"
quick-xml = { version = "0.39", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
thiserror = "2"
# XLSX number-format rendering (ECMA-376 §18.8.31); a port of SheetJS's `ssf`.
ssf-rs = "0.1"
log = "0.4"
rustc-hash = "2"
# Text measurement: font resolution via fontdb, metrics/advances via skrifa.
# fontdb is pinned to the 0.22 line resvg/usvg already bring into the tree.
fontdb = "0.22"
skrifa = "0.45"
# Pair-kerning for text measurement/drawing — pinned to the rustybuzz line
# usvg 0.44 already brings into the tree.
rustybuzz = "0.18"
unicode-segmentation = "1.13"
unicode-properties = "0.1"
# `raster` feature only — pinned to the tiny-skia line resvg 0.44 already
# brings into the tree.
tiny-skia = { version = "0.11", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "bmp",
    "tiff",
    "webp",
] }

[features]
# Rasterize LayoutedPage draw commands to RGBA (native screenshot path).
raster = ["dep:tiny-skia", "dep:image"]

[dev-dependencies]
serde_json = "1"
